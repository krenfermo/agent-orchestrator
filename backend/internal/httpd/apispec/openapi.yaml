        in: path
        name: id
        required: true
        schema:
          description: Project identifier (registry key).
          type: string
      - description: Repository root to report on. Defaults to the project's own root,
          which is the single-repo case.
        in: query
        name: repoPath
        schema:
          description: Repository root to report on. Defaults to the project's own
            root, which is the single-repo case.
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControllersProjectMemoryReportResponse'
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Internal Server Error
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Implemented
      summary: 'P2-B: is this project''s memory warm, and what is it costing each
        role. Runs the ordinary lifecycle freshness check (so a warm project costs
        a row read and no file I/O) and then assembles each role''s pack exactly as
        a dispatch would, reporting the budget, the items and bytes selected, the
        estimated tokens, and what the budget excluded. syncKind=none means memory
        was already at the repository''s current commit — the warm path the optimisation
        exists to produce.'
      tags:
      - projects
