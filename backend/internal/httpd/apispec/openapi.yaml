          description: Internal Server Error
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Implemented
      summary: 'P2-D: check which facts AO can still prove it is entitled to serve.
        Distinct from invalidate, which asks whether a fact''s source FILES moved:
        this asks whether its LICENCE still holds — same repository identity, a mutation-provenance
        row behind every canonical promotion, a provenance kind this build can check.
