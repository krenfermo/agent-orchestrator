              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Implemented
      summary: 'P1-B: discharge exactly the run''s outstanding durable obligation,
        and report which one it was. Idempotent; an obligation only a person can discharge
        is reported rather than driven.'
      tags:
      - workflows
  /api/v1/workflows/{workflowId}/start:
