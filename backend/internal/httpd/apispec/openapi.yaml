          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControllersPruneProjectMemoryRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControllersPruneProjectMemoryResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Internal Server Error
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Implemented
      summary: 'P2-E: retire canonical project memory that was built from a task''s
        isolated worktree instead of from the repository. A worktree is a checkout
        of a repository AO already knows, not a second repository; indexing one produced
        canonical facts derived from an unintegrated branch. Dry run unless apply
        is set, and it refuses anything it cannot prove is safe: registered repositories,
        workspaces a live execution is using, and any prune that would leave the project
        with no memory at all.'
