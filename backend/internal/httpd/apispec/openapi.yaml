        name: repoPath
        schema:
          description: Repository root to inspect. Defaults to the project's own root,
            which is the single-repo case.
          type: string
      - description: Narrow to one state. Omit to see every state, including the facts
          AO can no longer vouch for.
        in: query
        name: state
        schema:
          description: Narrow to one state. Omit to see every state, including the
            facts AO can no longer vouch for.
          enum:
          - valid
          - stale
          - invalidated
          - rebuilding
          type: string
      - description: Narrow to one item type (module, convention, architecture, ...).
        in: query
        name: type
        schema:
          description: Narrow to one item type (module, convention, architecture,
            ...).
          type: string
      - description: Narrow to facts about a subtree, by repo-relative path prefix.
        in: query
        name: path
        schema:
          description: Narrow to facts about a subtree, by repo-relative path prefix.
          type: string
      - description: Maximum items to return. Defaults to 200.
        in: query
        name: limit
        schema:
          description: Maximum items to return. Defaults to 200.
          maximum: 1000
          minimum: 1
          type:
          - "null"
          - integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControllersListProjectMemoryItemsResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Internal Server Error
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Implemented
      summary: 'P2-A: inspect the stored facts of one repository''s project memory,
        including the stale and invalidated ones — seeing those is the point of an
        inspect. Bodies are omitted; this answers what AO remembers and whether it
        can still vouch for it.'
      tags:
      - projects
  /api/v1/projects/{id}/memory/knowledge:
    get:
      operationId: listProjectMemoryKnowledge
      parameters:
      - description: Project identifier (registry key).
        in: path
        name: id
        required: true
        schema:
          description: Project identifier (registry key).
          type: string
      - description: Repository root to read. Defaults to every repository of the
          project.
        in: query
        name: repoPath
        schema:
          description: Repository root to read. Defaults to every repository of the
            project.
          type: string
      - description: Narrow to one kind of shared knowledge. Omit for all three.
        in: query
        name: type
        schema:
          description: Narrow to one kind of shared knowledge. Omit for all three.
          enum:
          - task_result
          - decision
          - known_risk
          type: string
      - description: Narrow to one lifecycle status. Defaults to active, which is
          what retrieval would actually serve.
        in: query
        name: status
        schema:
          description: Narrow to one lifecycle status. Defaults to active, which is
            what retrieval would actually serve.
          enum:
          - active
          - superseded
          - resolved
          - obsolete
          - conflicting
          type: string
      - description: 'Narrow to what one task produced. When set, every status is
          returned: a decision this task made that a later one replaced is still something
          this task produced.'
        in: query
        name: task
        schema:
          description: 'Narrow to what one task produced. When set, every status is
            returned: a decision this task made that a later one replaced is still
            something this task produced.'
          type: string
      - description: Maximum entries to return. Defaults to 200.
        in: query
        name: limit
        schema:
          description: Maximum entries to return. Defaults to 200.
          maximum: 1000
          minimum: 1
          type:
          - "null"
          - integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControllersListProjectMemoryKnowledgeResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Internal Server Error
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Implemented
      summary: 'P2-C: what tasks have taught this project, and what of it still holds.
        Task results, decisions and known risks, each with the lifecycle that decides
        whether retrieval would serve it: active, superseded (and by what), resolved
        (and by whom), obsolete, or conflicting. Active only by default, because that
        is what a task would actually receive; nothing is ever deleted, so asking
        for another status reconstructs what the project used to believe.'
      tags:
      - projects
