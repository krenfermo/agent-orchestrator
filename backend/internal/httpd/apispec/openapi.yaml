        in: query
        name: task
        schema:
          description: The task whose frozen context to read. One of task or run is
            required.
          type: string
      - description: The workflow run whose executions to read. One of task or run
          is required.
        in: query
        name: run
        schema:
          description: The workflow run whose executions to read. One of task or run
            is required.
          type: string
      - description: Resolve each manifest's item ids back into the facts they name,
          and report the ones that no longer exist.
        in: query
        name: expand
        schema:
          description: Resolve each manifest's item ids back into the facts they name,
            and report the ones that no longer exist.
          enum:
          - "true"
          - "false"
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControllersListProjectMemoryManifestsResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Internal Server Error
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Implemented
      summary: 'P2-C: what one execution was actually told. A context manifest records
        the identities of the memory facts a dispatch received — never the prompt,
        and never the facts'' text, which may have been superseded since. It is what
        makes "the Worker was working from a stale decision" checkable rather than
        suspected. Names a task or a workflow run; expand=true resolves the ids back
        into the facts and reports any that no longer exist.'
