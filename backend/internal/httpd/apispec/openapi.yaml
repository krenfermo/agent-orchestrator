          description: Internal Server Error
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Implemented
      summary: 'P2-A: re-derive one repository''s project memory. Bounded by the indexer''s
        limits and restart-safe; purge deletes the existing facts first, which is
        the escape hatch for memory that is wrong in a way a re-derivation cannot
        fix.'
      tags:
