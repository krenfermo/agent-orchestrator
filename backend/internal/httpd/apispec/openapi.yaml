          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Found
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Implemented
      summary: Authorize ONE additional integration fresh review for a task parked
        on integration_stale_review_after_rebase whose ordinary budget is spent, with
        a named human approver and a reason. The global bound is unchanged; the grant
        is recorded against this task and this workspace state, and a repeat request
        for the same state returns the existing grant rather than widening the budget
        again.
