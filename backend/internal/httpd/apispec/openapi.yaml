          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControllersWorkflowUsageLedgerResponse'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Found
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Implemented
      summary: 'P3-E: the canonical token/cost ledger for one run — totals, the per-role
        and per-model breakdown, base execution vs repair, an autonomous parent''s
        children, the roles whose spend AO cannot observe, and the frozen budget the
        run is measured against. Every figure carries its own provenance: `source`
        says whether tokens were reported by a provider or estimated by AO, and `cost.basis`
        says whether money was calculated (from the named rate card) or is simply
        unknown. `recorded: false` means no usage rows exist for the run and must
        be rendered as "no usage data recorded", never as zero. This is the ONLY total
        a client may present; the per-role `usage` block on the run detail is per-SESSION
        and several roles can share one session.'
      tags:
      - workflows
